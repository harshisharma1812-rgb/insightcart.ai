<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — InsightCart AI</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; background: var(--bg); }
    .auth-page { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
    .auth-box {
      width: 100%; max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 36px;
    }
    .auth-logo { text-align: center; margin-bottom: 28px; }
    .auth-logo-icon { font-size: 40px; margin-bottom: 8px; }
    .auth-logo-name { font-family: var(--font-display); font-size: 1.6rem; color: var(--cream); }
    .auth-logo-name span { color: var(--copper-lt); }
    .auth-tagline { font-size: 13px; color: var(--text-3); margin-top: 4px; }
    .auth-title { font-family: var(--font-display); font-size: 1.4rem; margin-bottom: 4px; color: var(--cream); }
    .auth-sub { font-size: 13px; color: var(--text-2); margin-bottom: 28px; }
    .auth-divider { text-align: center; color: var(--text-3); font-size: 12px; margin: 20px 0; position: relative; }
    .auth-divider::before, .auth-divider::after {
      content: ''; position: absolute; top: 50%; width: 42%; height: 1px; background: var(--border);
    }
    .auth-divider::before { left: 0; }
    .auth-divider::after { right: 0; }
    .demo-creds { background: var(--bg-3); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; font-size: 12px; color: var(--text-3); font-family: var(--font-mono); margin-bottom: 20px; }
    .demo-creds span { color: var(--copper-lt); }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="/index.html" class="nav-brand">
      <div class="nav-brand-icon">🛒</div>
      <span class="nav-brand-name">Insight<span>Cart</span> AI</span>
    </a>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-box page-content">
    <div class="auth-logo">
      <div class="auth-logo-icon">🛒</div>
      <div class="auth-logo-name">Insight<span>Cart</span> AI</div>
      <div class="auth-tagline">Your AI-powered shopping companion</div>
    </div>

    <div class="auth-title">Welcome back</div>
    <div class="auth-sub">Sign in to your personalized shopping experience</div>

    <div class="demo-creds">
      Demo Admin: <span>admin@insightcart.ai</span> / <span>Admin@123</span><br>
      Demo User: <span>alice@example.com</span> / <span>Pass@123</span>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-btn">
        Sign In
      </button>
    </form>

    <div class="auth-divider">or</div>

    <p style="text-align:center; font-size:14px; color:var(--text-2);">
      Don't have an account?
      <a href="/register.html" style="color:var(--copper-lt)">Create one →</a>
    </p>
  </div>
</div>

<script src="/js/tracker.js"></script>
<script src="/js/app.js"></script>
<script>
  // Redirect if already logged in
  if (Auth.isLoggedIn()) window.location.href = '/index.html';

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    btn.textContent = 'Signing in...';
    btn.disabled = true;

    try {
      const { token, user } = await api.post('/auth/login', {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      });
      Auth.setSession(token, user);
      showToast(`Welcome back, ${user.name.split(' ')[0]}! 👋`, 'success');

      const redirect = new URLSearchParams(window.location.search).get('redirect') || '/index.html';
      setTimeout(() => window.location.href = redirect, 600);
    } catch (err) {
      showToast(err.message, 'error');
      btn.textContent = 'Sign In';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
