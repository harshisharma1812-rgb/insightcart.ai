<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — InsightCart AI</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .cart-layout { display: grid; grid-template-columns: 1fr 340px; gap: 32px; align-items: start; }
    .cart-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; }
    .cart-panel.sticky-summary { position: sticky; top: calc(var(--nav-h) + 16px); }
    .summary-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 10px; color: var(--text-2); }
    .summary-total { display: flex; justify-content: space-between; font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; color: var(--cream); padding-top: 12px; border-top: 1px solid var(--border); }
    @media (max-width: 768px) { .cart-layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="/index.html" class="nav-brand">
      <div class="nav-brand-icon">🛒</div>
      <span class="nav-brand-name">Insight<span>Cart</span> AI</span>
    </a>
    <ul class="nav-links">
      <li><a href="/index.html">Home</a></li>
      <li><a href="/catalog.html">Catalog</a></li>
      <li><a href="/orders.html">Orders</a></li>
    </ul>
    <div class="nav-actions">
      <div id="nav-guest" style="display:none; gap:8px;">
        <a href="/login.html" class="btn btn-ghost btn-sm">Sign In</a>
      </div>
      <div id="nav-authed" style="display:none; align-items:center; gap:12px;">
        <a id="nav-admin-link" href="/admin/dashboard.html" class="btn btn-outline btn-sm" style="display:none">⚙️ Admin</a>
        <a href="/cart.html" class="cart-badge">🛒 Cart <span class="cart-count" style="display:none">0</span></a>
        <span id="nav-user-name" style="font-size:13px; color:var(--text-2)"></span>
        <button class="btn btn-ghost btn-sm" onclick="logout()">Sign Out</button>
      </div>
    </div>
  </div>
</nav>

<div class="container page-content" style="padding-top: 32px; padding-bottom: 80px;">
  <h1 style="font-family:var(--font-display); font-size:2rem; margin-bottom:24px;">Shopping Cart</h1>

  <div id="cart-empty" style="display:none;">
    <div class="empty-state">
      <div class="empty-state-icon">🛒</div>
      <div class="empty-state-title">Your cart is empty</div>
      <div class="empty-state-text">Add some products to get started!</div>
      <a href="/catalog.html" class="btn btn-primary">Browse Products</a>
    </div>
  </div>

  <div id="cart-content" style="display:none;">
    <div class="cart-layout">
      <!-- Cart Items -->
      <div class="cart-panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
          <h2 style="font-size:1.1rem; font-weight:600;">Items <span id="item-count" style="color:var(--text-3); font-size:0.9rem;"></span></h2>
          <button class="btn btn-ghost btn-sm" style="color:var(--error);" onclick="clearCart()">Clear All</button>
        </div>
        <div id="cart-items-list"></div>
      </div>

      <!-- Order Summary -->
      <div class="cart-panel sticky-summary">
        <h3 style="font-size:1rem; font-weight:600; margin-bottom:20px;">Order Summary</h3>
        <div class="summary-row"><span>Subtotal</span><span id="summary-subtotal">—</span></div>
        <div class="summary-row"><span>Tax (8%)</span><span id="summary-tax">—</span></div>
        <div class="summary-row"><span>Shipping</span><span style="color:var(--success)">Free</span></div>
        <div class="summary-total"><span>Total</span><span id="summary-total">—</span></div>
        <button class="btn btn-primary btn-block btn-lg" style="margin-top:20px;" onclick="proceedToCheckout()">
          Proceed to Checkout →
        </button>
        <a href="/catalog.html" class="btn btn-ghost btn-block" style="margin-top:8px;">Continue Shopping</a>
      </div>
    </div>
  </div>
</div>

<script src="/js/tracker.js"></script>
<script src="/js/app.js"></script>
<script>
if (!Auth.isLoggedIn()) window.location.href = '/login.html?redirect=/cart.html';

let cartData = [];

async function loadCart() {
  try {
    const { items, cartTotal } = await api.get('/cart');
    cartData = items;
    renderCart(items, cartTotal);
  } catch (err) {
    showToast(err.message, 'error');
  }
}

function renderCart(items, cartTotal) {
  const emptyEl   = document.getElementById('cart-empty');
  const contentEl = document.getElementById('cart-content');
  const listEl    = document.getElementById('cart-items-list');

  if (!items.length) {
    emptyEl.style.display   = 'block';
    contentEl.style.display = 'none';
    return;
  }

  emptyEl.style.display   = 'none';
  contentEl.style.display = 'block';
  document.getElementById('item-count').textContent = `(${items.length} ${items.length === 1 ? 'item' : 'items'})`;

  listEl.innerHTML = '';
  items.forEach(item => {
    const product = item.productId;
    if (!product) return;

    const el = document.createElement('div');
    el.className = 'cart-item';
    el.dataset.itemId = item._id;
    el.innerHTML = `
      <img class="cart-item-image"
           src="${product.imageUrl || 'https://via.placeholder.com/72'}"
           alt="${product.name}"
           onerror="this.src='https://via.placeholder.com/72?text=?'">
      <div class="cart-item-details">
        <div class="cart-item-name">${product.name}</div>
        <div class="cart-item-category">${product.category}</div>
        <div class="qty-control">
          <button class="qty-btn" onclick="updateQty('${item._id}', ${item.quantity - 1})">−</button>
          <span class="qty-val">${item.quantity}</span>
          <button class="qty-btn" onclick="updateQty('${item._id}', ${item.quantity + 1})">+</button>
        </div>
      </div>
      <div style="text-align:right; flex-shrink:0;">
        <div style="font-family:var(--font-display); font-size:1.1rem; font-weight:600; color:var(--cream);">
          ${fmt.currency(product.price * item.quantity)}
        </div>
        <div style="font-size:12px; color:var(--text-3);">${fmt.currency(product.price)} each</div>
        <button class="btn btn-ghost btn-sm" style="color:var(--error); margin-top:6px;"
          onclick="removeItem('${item._id}')">Remove</button>
      </div>
    `;
    listEl.appendChild(el);
  });

  updateSummary(cartTotal);
}

function updateSummary(subtotal) {
  const tax = subtotal * 0.08;
  const total = subtotal + tax;
  document.getElementById('summary-subtotal').textContent = fmt.currency(subtotal);
  document.getElementById('summary-tax').textContent      = fmt.currency(tax);
  document.getElementById('summary-total').textContent    = fmt.currency(total);
}

async function updateQty(itemId, newQty) {
  if (newQty < 1) { await removeItem(itemId); return; }
  try {
    await api.put(`/cart/${itemId}`, { quantity: newQty });
    loadCart(); updateCartBadge();
  } catch (err) { showToast(err.message, 'error'); }
}

async function removeItem(itemId) {
  try {
    await api.delete(`/cart/${itemId}`);
    showToast('Item removed', 'info');
    loadCart(); updateCartBadge();
    Tracker.track('remove_from_cart', {});
  } catch (err) { showToast(err.message, 'error'); }
}

async function clearCart() {
  if (!confirm('Remove all items from cart?')) return;
  try {
    await api.delete('/cart');
    loadCart(); updateCartBadge();
  } catch (err) { showToast(err.message, 'error'); }
}

function proceedToCheckout() {
  if (!cartData.length) { showToast('Cart is empty', 'warning'); return; }
  window.location.href = '/checkout.html';
}

loadCart();
</script>
</body>
</html>
