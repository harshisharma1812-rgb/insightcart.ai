<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — InsightCart AI</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    .auth-page { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
    .auth-box { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 36px; }
    .auth-logo { text-align: center; margin-bottom: 28px; }
    .auth-logo-icon { font-size: 40px; margin-bottom: 8px; }
    .auth-logo-name { font-family: var(--font-display); font-size: 1.6rem; color: var(--cream); }
    .auth-logo-name span { color: var(--copper-lt); }
    .auth-title { font-family: var(--font-display); font-size: 1.4rem; margin-bottom: 4px; color: var(--cream); }
    .auth-sub { font-size: 13px; color: var(--text-2); margin-bottom: 28px; }
    .perks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px; }
    .perk { background: var(--bg-3); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="/index.html" class="nav-brand">
      <div class="nav-brand-icon">🛒</div>
      <span class="nav-brand-name">Insight<span>Cart</span> AI</span>
    </a>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-box page-content">
    <div class="auth-logo">
      <div class="auth-logo-icon">🧠</div>
      <div class="auth-logo-name">Insight<span>Cart</span> AI</div>
    </div>

    <div class="auth-title">Create your account</div>
    <div class="auth-sub">Join thousands of smart shoppers</div>

    <div class="perks">
      <div class="perk">✨ AI recommendations</div>
      <div class="perk">🔥 Trending alerts</div>
      <div class="perk">📦 Order tracking</div>
      <div class="perk">🧠 Personalized feed</div>
    </div>

    <form id="register-form">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" id="name" class="form-input" placeholder="Jane Smith" required>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-input" placeholder="At least 6 characters" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="reg-btn">
        Create Account
      </button>
    </form>

    <p style="text-align:center; font-size:14px; color:var(--text-2); margin-top:20px;">
      Already have an account?
      <a href="/login.html" style="color:var(--copper-lt)">Sign in →</a>
    </p>
  </div>
</div>

<script src="/js/tracker.js"></script>
<script src="/js/app.js"></script>
<script>
  if (Auth.isLoggedIn()) window.location.href = '/index.html';

  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('reg-btn');
    btn.textContent = 'Creating account...';
    btn.disabled = true;

    try {
      const { token, user } = await api.post('/auth/register', {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      });
      Auth.setSession(token, user);
      showToast(`Welcome to InsightCart AI, ${user.name.split(' ')[0]}! 🎉`, 'success');
      setTimeout(() => window.location.href = '/index.html', 800);
    } catch (err) {
      showToast(err.message, 'error');
      btn.textContent = 'Create Account';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
