<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — InsightCart AI</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .order-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 16px; }
    .order-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: var(--bg-3); border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 12px; }
    .order-meta { font-size: 12px; color: var(--text-3); }
    .order-items-preview { padding: 16px 20px; display: flex; gap: 8px; flex-wrap: wrap; }
    .order-item-thumb { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; background: var(--bg-3); }
    .order-footer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="/index.html" class="nav-brand">
      <div class="nav-brand-icon">🛒</div>
      <span class="nav-brand-name">Insight<span>Cart</span> AI</span>
    </a>
    <ul class="nav-links">
      <li><a href="/index.html">Home</a></li>
      <li><a href="/catalog.html">Catalog</a></li>
      <li><a href="/orders.html" class="active">Orders</a></li>
    </ul>
    <div class="nav-actions">
      <div id="nav-guest" style="display:none; gap:8px;">
        <a href="/login.html" class="btn btn-ghost btn-sm">Sign In</a>
      </div>
      <div id="nav-authed" style="display:none; align-items:center; gap:12px;">
        <a id="nav-admin-link" href="/admin/dashboard.html" class="btn btn-outline btn-sm" style="display:none">⚙️ Admin</a>
        <a href="/cart.html" class="cart-badge">🛒 <span class="cart-count" style="display:none">0</span></a>
        <span id="nav-user-name" style="font-size:13px; color:var(--text-2)"></span>
        <button class="btn btn-ghost btn-sm" onclick="logout()">Sign Out</button>
      </div>
    </div>
  </div>
</nav>

<div class="container page-content" style="padding: 32px 0 80px;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:28px;">
    <h1 style="font-family:var(--font-display); font-size:2rem;">My Orders</h1>
    <a href="/catalog.html" class="btn btn-secondary">+ Shop More</a>
  </div>

  <div id="orders-container">
    <div class="order-card skeleton" style="height:140px; margin-bottom:16px;"></div>
    <div class="order-card skeleton" style="height:140px; margin-bottom:16px;"></div>
  </div>

  <div id="orders-empty" style="display:none;">
    <div class="empty-state">
      <div class="empty-state-icon">📦</div>
      <div class="empty-state-title">No orders yet</div>
      <div class="empty-state-text">Your order history will appear here once you make a purchase.</div>
      <a href="/catalog.html" class="btn btn-primary">Start Shopping</a>
    </div>
  </div>
</div>

<script src="/js/tracker.js"></script>
<script src="/js/app.js"></script>
<script>
if (!Auth.isLoggedIn()) window.location.href = '/login.html?redirect=/orders.html';

const STATUS_COLORS = {
  pending: 'warning', processing: 'info', shipped: 'copper',
  delivered: 'success', cancelled: 'error'
};
const STATUS_ICONS = {
  pending: '⏳', processing: '⚙️', shipped: '🚚', delivered: '✅', cancelled: '❌'
};

async function loadOrders() {
  const container = document.getElementById('orders-container');
  try {
    const { orders } = await api.get('/orders');
    container.innerHTML = '';

    if (!orders.length) {
      document.getElementById('orders-empty').style.display = 'block';
      return;
    }

    orders.forEach(order => {
      const el = document.createElement('div');
      el.className = 'order-card';
      el.innerHTML = `
        <div class="order-header">
          <div>
            <div style="font-weight:600; font-size:15px;">Order #${order._id.slice(-8).toUpperCase()}</div>
            <div class="order-meta">${fmt.date(order.createdAt)} · ${order.items.length} item${order.items.length > 1 ? 's' : ''}</div>
          </div>
          <div style="display:flex; gap:10px; align-items:center;">
            <span class="badge badge-${STATUS_COLORS[order.status] || 'neutral'}">
              ${STATUS_ICONS[order.status]} ${order.status.charAt(0).toUpperCase() + order.status.slice(1)}
            </span>
            <span class="badge badge-${order.paymentStatus === 'paid' ? 'success' : order.paymentStatus === 'failed' ? 'error' : 'neutral'}">
              💳 ${order.paymentStatus.charAt(0).toUpperCase() + order.paymentStatus.slice(1)}
            </span>
          </div>
        </div>
        <div class="order-items-preview">
          ${order.items.slice(0, 5).map(item => `
            <img class="order-item-thumb"
              src="${item.imageUrl || 'https://via.placeholder.com/48'}"
              title="${item.name}"
              onerror="this.src='https://via.placeholder.com/48?text=?'">
          `).join('')}
          ${order.items.length > 5 ? `<div style="width:48px;height:48px;background:var(--bg-3);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-3);">+${order.items.length - 5}</div>` : ''}
        </div>
        <div class="order-footer">
          <div style="font-size:13px; color:var(--text-2);">
            ${order.items.map(i => i.name).join(', ').substring(0, 60)}${order.items.map(i=>i.name).join(', ').length > 60 ? '...' : ''}
          </div>
          <div style="font-family:var(--font-display); font-size:1.1rem; font-weight:600; color:var(--cream);">
            ${fmt.currency(order.total)}
          </div>
        </div>
      `;
      container.appendChild(el);
    });
  } catch (err) {
    container.innerHTML = `<p style="color:var(--error)">${err.message}</p>`;
  }
}

loadOrders();
</script>
</body>
</html>
