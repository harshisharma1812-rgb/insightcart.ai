<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products — Admin | InsightCart AI</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .admin-layout { display: flex; min-height: calc(100vh - 64px); }
    .admin-sidebar { width: 220px; background: var(--bg-2); border-right: 1px solid var(--border); padding: 20px 12px; flex-shrink: 0; }
    .admin-main { flex: 1; padding: 32px; overflow-y: auto; }
    .sidebar-item { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:var(--radius); color:var(--text-2); font-size:14px; cursor:pointer; transition:all var(--transition); margin-bottom:2px; text-decoration:none; }
    .sidebar-item:hover { background: var(--surface); color: var(--text); }
    .sidebar-item.active { background: rgba(196,122,58,0.12); color: var(--copper-lt); }
    .product-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .product-thumb { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; background: var(--bg-3); }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="/index.html" class="nav-brand">
      <div class="nav-brand-icon">🛒</div>
      <span class="nav-brand-name">Insight<span>Cart</span> AI</span>
    </a>
    <div style="display:flex; align-items:center; gap:8px;">
      <span class="badge badge-copper">⚙️ Admin Panel</span>
      <a href="/index.html" class="btn btn-ghost btn-sm">← Shop</a>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Sign Out</button>
    </div>
  </div>
</nav>

<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="sidebar-label">Analytics</div>
    <a class="sidebar-item" href="/admin/dashboard.html">📊 Overview</a>
    <a class="sidebar-item" href="/admin/dashboard.html">🧠 Behavior Intel</a>
    <div class="sidebar-label" style="margin-top:16px;">Management</div>
    <a class="sidebar-item active">📦 Products</a>
    <a class="sidebar-item" href="/admin/dashboard.html">🛒 Orders</a>
    <a class="sidebar-item" href="/admin/dashboard.html">👥 Users</a>
  </aside>

  <main class="admin-main page-content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
      <h2 style="font-family:var(--font-display); font-size:1.8rem;">Product Management</h2>
      <button class="btn btn-primary" onclick="openProductForm()">+ Add Product</button>
    </div>

    <div style="display:flex; gap:12px; margin-bottom:20px;">
      <input type="text" id="product-search" class="form-input" placeholder="Search products..." style="max-width:300px;"
        oninput="filterProducts()">
      <select id="product-cat-filter" class="form-input" style="max-width:200px;" onchange="filterProducts()">
        <option value="">All Categories</option>
      </select>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Product</th><th>Category</th><th>Price</th>
            <th>Stock</th><th>Views</th><th>Purchases</th><th>Status</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="products-table">
          <tr><td colspan="8" style="text-align:center; padding:32px; color:var(--text-3);">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<!-- Product Form Modal -->
<div id="product-modal" class="modal-overlay" style="display:none;">
  <div class="modal" style="max-width:640px;">
    <div class="modal-header">
      <h3 class="modal-title" id="form-title">Add Product</h3>
      <button class="modal-close" onclick="closeProductForm()">✕</button>
    </div>
    <div class="modal-body">
      <form id="product-form">
        <input type="hidden" id="product-id">
        <div class="product-form-grid">
          <div class="form-group" style="grid-column:1/-1">
            <label class="form-label">Product Name</label>
            <input type="text" id="p-name" class="form-input" required placeholder="e.g. Sony WH-1000XM5">
          </div>
          <div class="form-group">
            <label class="form-label">Category</label>
            <input type="text" id="p-category" class="form-input" required placeholder="Electronics">
          </div>
          <div class="form-group">
            <label class="form-label">Brand</label>
            <input type="text" id="p-brand" class="form-input" placeholder="Sony">
          </div>
          <div class="form-group">
            <label class="form-label">Price ($)</label>
            <input type="number" id="p-price" class="form-input" required min="0" step="0.01" placeholder="99.99">
          </div>
          <div class="form-group">
            <label class="form-label">Stock</label>
            <input type="number" id="p-stock" class="form-input" required min="0" placeholder="100">
          </div>
          <div class="form-group" style="grid-column:1/-1">
            <label class="form-label">Image URL</label>
            <input type="url" id="p-imageUrl" class="form-input" placeholder="https://...">
          </div>
          <div class="form-group" style="grid-column:1/-1">
            <label class="form-label">Description</label>
            <textarea id="p-description" class="form-input" rows="3" required placeholder="Product description..."></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Rating (0-5)</label>
            <input type="number" id="p-rating" class="form-input" min="0" max="5" step="0.1" placeholder="4.5">
          </div>
          <div class="form-group">
            <label class="form-label">Review Count</label>
            <input type="number" id="p-reviewCount" class="form-input" min="0" placeholder="0">
          </div>
          <div class="form-group" style="grid-column:1/-1">
            <label class="form-label">Tags (comma-separated)</label>
            <input type="text" id="p-tags" class="form-input" placeholder="wireless, headphones, noise-cancelling">
          </div>
        </div>
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:8px;">
          <button type="button" class="btn btn-secondary" onclick="closeProductForm()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="product-submit-btn">Save Product</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="/js/tracker.js"></script>
<script src="/js/app.js"></script>
<script>
if (!Auth.isLoggedIn() || !Auth.isAdmin()) window.location.href = '/login.html';

let allProducts = [];

async function loadProducts() {
  const tbody = document.getElementById('products-table');
  try {
    const { products } = await api.get('/admin/products');
    allProducts = products;
    renderProducts(products);
    populateCategoryFilter(products);
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="8" style="color:var(--error); padding:16px;">${err.message}</td></tr>`;
  }
}

function renderProducts(products) {
  const tbody = document.getElementById('products-table');
  if (!products.length) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:32px; color:var(--text-3);">No products found</td></tr>';
    return;
  }
  tbody.innerHTML = products.map(p => `
    <tr>
      <td>
        <div style="display:flex; align-items:center; gap:10px;">
          <img class="product-thumb" src="${p.imageUrl || 'https://via.placeholder.com/40'}"
               onerror="this.src='https://via.placeholder.com/40'">
          <div>
            <div style="font-weight:500; font-size:13px; max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${p.name}</div>
            <div style="font-size:11px; color:var(--text-3);">${p.brand || '—'}</div>
          </div>
        </div>
      </td>
      <td><span class="badge badge-copper">${p.category}</span></td>
      <td><strong>${fmt.currency(p.price)}</strong></td>
      <td style="color:${p.stock < 10 ? 'var(--warning)' : 'var(--text)'}">${p.stock}</td>
      <td>👁 ${fmt.number(p.viewCount || 0)}</td>
      <td>✅ ${fmt.number(p.purchaseCount || 0)}</td>
      <td><span class="badge ${p.isActive ? 'badge-success' : 'badge-error'}">${p.isActive ? 'Active' : 'Inactive'}</span></td>
      <td>
        <div style="display:flex; gap:6px;">
          <button class="btn btn-sm btn-secondary" onclick='editProduct(${JSON.stringify(p)})'>Edit</button>
          <button class="btn btn-sm btn-danger" onclick="deleteProduct('${p._id}')">
            ${p.isActive ? 'Deactivate' : 'Activate'}
          </button>
        </div>
      </td>
    </tr>
  `).join('');
}

function filterProducts() {
  const q = document.getElementById('product-search').value.toLowerCase();
  const cat = document.getElementById('product-cat-filter').value;
  const filtered = allProducts.filter(p =>
    (!q || p.name.toLowerCase().includes(q) || p.brand?.toLowerCase().includes(q)) &&
    (!cat || p.category === cat)
  );
  renderProducts(filtered);
}

function populateCategoryFilter(products) {
  const cats = [...new Set(products.map(p => p.category))].sort();
  const sel = document.getElementById('product-cat-filter');
  cats.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    sel.appendChild(opt);
  });
}

function openProductForm(product = null) {
  document.getElementById('form-title').textContent = product ? 'Edit Product' : 'Add Product';
  document.getElementById('product-id').value       = product?._id || '';
  document.getElementById('p-name').value           = product?.name || '';
  document.getElementById('p-category').value       = product?.category || '';
  document.getElementById('p-brand').value          = product?.brand || '';
  document.getElementById('p-price').value          = product?.price || '';
  document.getElementById('p-stock').value          = product?.stock ?? '';
  document.getElementById('p-imageUrl').value       = product?.imageUrl || '';
  document.getElementById('p-description').value    = product?.description || '';
  document.getElementById('p-rating').value         = product?.rating || '';
  document.getElementById('p-reviewCount').value    = product?.reviewCount || '';
  document.getElementById('p-tags').value           = (product?.tags || []).join(', ');
  document.getElementById('product-modal').style.display = 'flex';
}

function editProduct(product) { openProductForm(product); }
function closeProductForm() { document.getElementById('product-modal').style.display = 'none'; }

document.getElementById('product-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('product-submit-btn');
  btn.textContent = 'Saving...'; btn.disabled = true;

  const id = document.getElementById('product-id').value;
  const payload = {
    name:        document.getElementById('p-name').value,
    category:    document.getElementById('p-category').value,
    brand:       document.getElementById('p-brand').value,
    price:       parseFloat(document.getElementById('p-price').value),
    stock:       parseInt(document.getElementById('p-stock').value),
    imageUrl:    document.getElementById('p-imageUrl').value,
    description: document.getElementById('p-description').value,
    rating:      parseFloat(document.getElementById('p-rating').value) || 0,
    reviewCount: parseInt(document.getElementById('p-reviewCount').value) || 0,
    tags:        document.getElementById('p-tags').value.split(',').map(t => t.trim()).filter(Boolean),
  };

  try {
    if (id) {
      await api.put(`/products/${id}`, payload);
      showToast('Product updated!', 'success');
    } else {
      await api.post('/products', payload);
      showToast('Product created!', 'success');
    }
    closeProductForm();
    loadProducts();
  } catch (err) {
    showToast(err.message, 'error');
  } finally {
    btn.textContent = 'Save Product'; btn.disabled = false;
  }
});

async function deleteProduct(productId) {
  if (!confirm('Deactivate this product?')) return;
  try {
    await api.delete(`/products/${productId}`);
    showToast('Product deactivated', 'info');
    loadProducts();
  } catch (err) { showToast(err.message, 'error'); }
}

loadProducts();
</script>
</body>
</html>
